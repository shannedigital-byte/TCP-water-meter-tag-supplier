<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TCP Supplier Tracker – Water Meter Tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Reads the supplier tables from README.md in this repo. Six-column table on desktop, one card per supplier on phones. */
:root {
  --bg: #f4f8f8; --surface: #ffffff; --fg: #12282a; --muted: #5b7476; --line: #d6e3e4;
  --teal: #0b5f66; --teal-2: #03afbb; --yellow: #f5b800; --on-teal: #ffffff;
  --yes: #1d7a3e; --yes-bg: #e1f4e7; --wait: #9a5c00; --wait-bg: #fff1cf;
  --none: #5b7476; --none-bg: #edf2f2; --no: #a33a3a; --no-bg: #fbe6e6;
  --display: "Barlow Semi Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1a1b; --surface: #132527; --fg: #e3eeee; --muted: #93aeb0; --line: #24403f;
    --teal: #5fd0d8; --teal-2: #2bb8c2; --yellow: #f5c33b; --on-teal: #0d1a1b;
    --yes: #6fd394; --yes-bg: #123522; --wait: #f3b54a; --wait-bg: #3a2c10;
    --none: #93aeb0; --none-bg: #1c3031; --no: #ef8a8a; --no-bg: #3c1a1a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 22px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; }
header { display: grid; gap: 10px; }
h1 { margin: 0; font: 700 clamp(24px, 4vw, 32px)/1.15 var(--display); text-wrap: balance; }
h1 .bar { display: inline-block; width: 9px; height: .8em; background: var(--yellow); margin-right: 10px; border-radius: 2px; vertical-align: -1px; }
.spec { margin: 0; color: var(--muted); max-width: 75ch; }
.bar-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; min-height: 26px; }
.chip { padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.t-yes, .s-yes { color: var(--yes); background: var(--yes-bg); }
.t-wait, .s-wait { color: var(--wait); background: var(--wait-bg); }
.t-none, .s-none { color: var(--none); background: var(--none-bg); }
.s-no { color: var(--no); background: var(--no-bg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { font: 600 14px/1 var(--body); padding: 9px 14px; border-radius: 8px; text-decoration: none; border: 1px solid var(--teal); cursor: pointer; }
.btn.primary { background: var(--teal); color: var(--on-teal); }
.btn.ghost { background: transparent; color: var(--teal); }
.btn:focus-visible { outline: 2px solid var(--teal-2); outline-offset: 2px; }
.updated { font-size: 13px; color: var(--muted); }
section { display: grid; gap: 8px; }
h2 { margin: 0; font: 700 15px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.frame { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; table-layout: fixed; min-width: 960px; }
col.c-sup { width: 17%; } col.c-ph { width: 14%; } col.c-em { width: 23%; } col.c-st { width: 19%; } col.c-q { width: 9%; } col.c-n { width: 18%; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
th { font: 600 12px/1.2 var(--body); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.sup b { display: block; }
.sup span { display: block; color: var(--muted); font-size: 13px; }
.val { overflow-wrap: anywhere; }
.na { color: var(--muted); font-style: italic; font-size: 13px; }
td .chip { display: inline-block; white-space: normal; }
.empty { padding: 24px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

@media (max-width: 760px) {
  .frame { background: transparent; border: 0; overflow: visible; }
  table, tbody { display: block; min-width: 0; }
  thead, colgroup { display: none; }
  tbody { display: grid; gap: 10px; }
  tbody tr { display: grid; grid-template-columns: 1fr; gap: 10px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  tbody td { display: block; padding: 0; border: 0; min-width: 0; }
  tbody td[data-label]::before { content: attr(data-label); display: block; font: 600 11px/1.3 var(--body);
    letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  td.sup b { font: 700 19px/1.2 var(--display); }
  td.blank { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="bar" aria-hidden="true"></span>Water Meter Tag – Supplier Tracker</h1>
    <p class="spec">Option 2 tag · 90 × 45 mm waterproof PP/PVC · full colour both sides · quotes for 250 / 500 / 1,000, inc GST, delivered to Sydney.</p>
    <div class="bar-row">
      <div class="tally" id="tally" aria-live="polite"></div>
      <div class="actions">
        <span class="updated" id="updated"></span>
        <a class="btn primary" id="edit" href="https://github.com/shannedigital-byte/TCP-water-meter-tag-supplier/edit/main/README.md" target="_blank" rel="noopener">Edit on GitHub</a>
        <button class="btn ghost" id="refresh" type="button">Refresh</button>
      </div>
    </div>
  </header>
  <div id="lists"><p class="empty">Loading the supplier list…</p></div>
</div>

<script>
const REPO = "shannedigital-byte/TCP-water-meter-tag-supplier";
const SOURCES = () => [
  "https://raw.githubusercontent.com/" + REPO + "/main/README.md?t=" + Date.now(),
  "README.md?t=" + Date.now()
];
const STATUS_CLASS = {
  "not contacted": "s-none", "emailed – waiting on quote": "s-wait", "called – waiting on quote": "s-wait",
  "replied": "s-yes", "quote received": "s-yes", "not suitable": "s-no"
};
const norm = s => (s || "").toLowerCase().replace(/\s*[-–—]\s*/g, " – ").replace(/\s+/g, " ").trim();
const stClass = s => STATUS_CLASS[norm(s)] || "s-none";
const lists = document.getElementById("lists");

// Read every markdown table under a "## <Region>" heading.
function parse(md) {
  const rows = []; let region = null, cols = null;
  md.split(/\r?\n/).forEach(line => {
    const h = line.match(/^##\s+(.+)/);
    if (h) { region = h[1].trim(); cols = null; return; }
    if (!region || !line.trim().startsWith("|")) { if (!line.trim()) cols = null; return; }
    const cells = line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
    if (cells.every(c => /^:?-{2,}:?$/.test(c))) return;
    if (!cols) { cols = cells.map(c => c.toLowerCase()); return; }
    const r = { region };
    cols.forEach((c, i) => { r[c] = cells[i] || ""; });
    if (r.supplier) rows.push(r);
  });
  return rows;
}

function td(tr, cls, label) {
  const c = document.createElement("td"); if (cls) c.className = cls; if (label) c.dataset.label = label;
  tr.appendChild(c); return c;
}
function contact(cell, v) {
  const s = document.createElement("span");
  if (!v || /^Not published/i.test(v)) { s.className = "na"; s.textContent = v ? v.replace(/^Not published\s*[-–—]\s*/i, "") : "—"; }
  else { s.className = "val"; s.textContent = v; }
  cell.appendChild(s);
}
function text(cell, v) {
  if (!v) { cell.classList.add("blank"); cell.appendChild(Object.assign(document.createElement("span"), { className: "na", textContent: "—" })); return; }
  cell.appendChild(Object.assign(document.createElement("span"), { className: "val", textContent: v }));
}
function rowEl(r) {
  const tr = document.createElement("tr");
  const sup = td(tr, "sup");
  sup.append(Object.assign(document.createElement("b"), { textContent: r.supplier }),
             Object.assign(document.createElement("span"), { textContent: r.location || "" }));
  contact(td(tr, "ph", "Phone"), r.phone);
  contact(td(tr, "em", "Email"), r.email);
  const st = td(tr, "st", "Status");
  st.appendChild(Object.assign(document.createElement("span"), { className: "chip " + stClass(r.status), textContent: r.status || "Not contacted" }));
  text(td(tr, "q", "Quote"), r.quote);
  text(td(tr, "n", "Notes"), r.notes);
  return tr;
}
function section(title, rows) {
  const sec = document.createElement("section");
  sec.appendChild(Object.assign(document.createElement("h2"), { textContent: title }));
  const frame = document.createElement("div"); frame.className = "frame";
  const t = document.createElement("table");
  const cg = document.createElement("colgroup");
  ["c-sup", "c-ph", "c-em", "c-st", "c-q", "c-n"].forEach(c => cg.appendChild(Object.assign(document.createElement("col"), { className: c })));
  const head = document.createElement("thead"); const hr = document.createElement("tr");
  ["Supplier", "Phone", "Email", "Status", "Quote", "Notes"].forEach(x => hr.appendChild(Object.assign(document.createElement("th"), { textContent: x })));
  head.appendChild(hr);
  const body = document.createElement("tbody"); rows.forEach(r => body.appendChild(rowEl(r)));
  t.append(cg, head, body); frame.appendChild(t); sec.appendChild(frame);
  return sec;
}
function render(data) {
  lists.textContent = "";
  if (!data.length) { lists.appendChild(Object.assign(document.createElement("p"), { className: "empty", textContent: "No suppliers found in README.md." })); return; }
  const wrap = document.createElement("div"); wrap.style.display = "grid"; wrap.style.gap = "20px";
  [...new Set(data.map(r => r.region))].forEach(reg => wrap.appendChild(section(reg, data.filter(r => r.region === reg))));
  lists.appendChild(wrap);

  const tally = document.getElementById("tally"); tally.textContent = "";
  const n = data.length;
  const contacted = data.filter(r => norm(r.status) && norm(r.status) !== "not contacted").length;
  const replied = data.filter(r => ["replied", "quote received"].includes(norm(r.status))).length;
  const unsuitable = data.filter(r => norm(r.status) === "not suitable").length;
  [[contacted + " of " + n + " contacted", "t-yes"], [replied + " replied", "t-yes"],
   [(contacted - replied - unsuitable) + " waiting on a reply", "t-wait"], [(n - contacted) + " not contacted yet", "t-none"]]
    .forEach(([txt, cls]) => tally.appendChild(Object.assign(document.createElement("span"), { className: "chip " + cls, textContent: txt })));
}
async function load() {
  for (const url of SOURCES()) {
    try {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) continue;
      render(parse(await res.text()));
      return;
    } catch (e) { /* try the next source */ }
  }
  lists.textContent = "";
  lists.appendChild(Object.assign(document.createElement("p"), { className: "empty", textContent: "The tracker couldn't load. Check your connection and press Refresh." }));
}
async function lastUpdated() {
  try {
    const res = await fetch("https://api.github.com/repos/" + REPO + "/commits?path=README.md&per_page=1");
    if (!res.ok) return;
    const [c] = await res.json();
    const d = new Date(c.commit.committer.date);
    document.getElementById("updated").textContent = "Updated " + d.toLocaleString("en-AU", {
      timeZone: "Australia/Sydney", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
  } catch (e) { /* leave blank */ }
}
document.getElementById("refresh").addEventListener("click", () => { load(); lastUpdated(); });
load(); lastUpdated();
</script>
</body>
</html>
